[project]
name = "knowledge-graph-rag"
version = "0.1.0"
description = "Hybrid Knowledge Graph RAG with PostgreSQL pgvector and Neo4j"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pgvector>=0.2.0",
    "psycopg2-binary>=2.9.9",
    "neo4j>=5.18.0",
    "openai>=1.12.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "datasets>=2.18.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
